<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider Business Intelligence Platform</title>
    <meta
      name="description"
      content="Provider Business Intelligence Platform — Marketplace, Operational, Referral, Bundle, and Pricing Intelligence in one unified decision-support platform for healthcare providers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied synchronously, before first paint, so there is never a flash
      // of the wrong theme. Mirrors the resolution order used by useTheme:
      // an explicit stored choice wins, otherwise fall back to the OS
      // preference.
      (function () {
        try {
          var stored = localStorage.getItem("mpi-theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {
          // localStorage may be unavailable (private mode, etc.) — default
          // to the dark theme, matching the app's original appearance.
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
